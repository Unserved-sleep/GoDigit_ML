[pytest]
# -----------------------------------------------------------------
# Base URL — override with --base-url CLI flag if needed
# -----------------------------------------------------------------
base_url = https://www.saucedemo.com

# -----------------------------------------------------------------
# Default CLI options
#   --headed          : remove for headless (CI)
#   --browser         : chromium | firefox | webkit
#   --slowmo          : ms delay between actions (useful for demos)
#   --html            : auto-generate HTML report
#   --self-contained-html : embed assets inside HTML
# -----------------------------------------------------------------
addopts =
    --browser=chromium
    --html=reports/report.html
    --self-contained-html
    -v
    --tb=short

# -----------------------------------------------------------------
# Markers — prevents PytestUnknownMarkWarning
# -----------------------------------------------------------------
markers =
    smoke: core happy-path tests (run on every commit)
    regression: extended coverage tests
    checkout: checkout flow specific tests
    login: login specific tests
    cart: cart specific tests

# -----------------------------------------------------------------
# Test discovery
# -----------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -----------------------------------------------------------------
# Reruns for flaky tests
# -----------------------------------------------------------------
reruns = 1
reruns_delay = 2
